name: Build and Release APK Viewer

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install androguard pillow lxml frida pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --collect-all androguard --collect-all PIL --hidden-import=PIL._tkinter_finder apk-viewer.py

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/apk-viewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
